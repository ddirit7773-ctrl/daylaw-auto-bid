name: Build Windows Desktop App

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Compile check
        shell: pwsh
        run: |
          python -m py_compile daylaw_app.py daylaw_app_v12_hotfix.py desktop_app.py desktop_app_v2.py desktop_app_v3.py desktop_app_v4.py desktop_app_v5.py desktop_app_v6.py desktop_app_v7.py desktop_app_v8.py desktop_app_v9.py auto_cleanup.py approve_immediate_20.py approve_immediate_partial.py restricted_cleanup.py restricted_cleanup_v2.py restore_deleted_keyword.py query_account_stats.py execute_v2_delete.py run_v2_scan.py src/keyword_cleaner/naver_api.py src/keyword_cleaner/stats_v2.py src/keyword_cleaner/policy_v2.py src/keyword_cleaner/live_safety.py src/keyword_cleaner/lifecycle_store.py

      - name: GUI empty-data regression self test
        shell: pwsh
        run: |
          @'
          from desktop_app_v8 import DesktopAppV8
          assert DesktopAppV8._read_csv(None) == []
          print("GUI EMPTY-DATA STARTUP TEST OK")
          '@ | python -

      - name: Safe-fast policy self test
        shell: pwsh
        run: |
          @'
          from src.keyword_cleaner.policy_v2 import ActivitySnapshot, CleanerPolicy, classify_snapshot

          policy = CleanerPolicy.load()
          common = dict(
              adgroup_name="테스트업체",
              keyword="테스트업체일반키워드",
              policy=policy,
          )

          active = ActivitySnapshot(
              age_days=max(policy.general_inactivity_days, policy.general_protection_days) + 10,
              inactivity_impressions=3,
              inactivity_clicks=0,
              click_window_clicks=None,
              exposure_eligible=True,
              stats_complete=True,
          )
          assert classify_snapshot(snapshot=active, **common).status == "WATCH"

          missing_long_window = ActivitySnapshot(
              age_days=max(policy.general_inactivity_days, policy.general_protection_days) + 10,
              inactivity_impressions=0,
              inactivity_clicks=0,
              click_window_clicks=None,
              exposure_eligible=True,
              stats_complete=False,
          )
          assert classify_snapshot(snapshot=missing_long_window, **common).status == "DATA_INSUFFICIENT"

          fully_silent = ActivitySnapshot(
              age_days=max(policy.general_inactivity_days, policy.general_protection_days) + 10,
              inactivity_impressions=0,
              inactivity_clicks=0,
              click_window_clicks=0,
              exposure_eligible=True,
              stats_complete=True,
          )
          assert classify_snapshot(snapshot=fully_silent, **common).status == "DELETE_PENDING"
          print("SAFE FAST POLICY TEST OK")
          '@ | python -

      - name: Restricted master-report self test
        shell: pwsh
        run: |
          @'
          from restricted_cleanup import parse_keyword_master_limited_ids, scan_restricted_candidate

          base = {
              "tier": "GENERAL",
              "age_days": "120",
              "campaign_status": "ELIGIBLE",
              "adgroup_status": "ELIGIBLE",
              "keyword_id": "nkw-one",
          }
          report = (
              "1\tgrp\tnkw-one\tkw1\t70\t\t\t0\t30\t1\t2026-01-01T00:00:00Z\t\t0\n"
              "1\tgrp\tnkw-two\tkw2\t70\t\t\t0\t20\t1\t2026-01-01T00:00:00Z\t\t0\n"
          )
          limited = parse_keyword_master_limited_ids(report)
          assert limited == {"nkw-one"}
          assert scan_restricted_candidate(base, limited) is True
          assert scan_restricted_candidate({**base, "keyword_id": "nkw-two"}, limited) is False
          assert scan_restricted_candidate({**base, "tier": "TYPE_CORE"}, limited) is False
          assert scan_restricted_candidate({**base, "age_days": "89"}, limited) is False
          print("RESTRICTED MASTER REPORT TEST OK")
          '@ | python -

      - name: Production cleanup group safety self test
        shell: pwsh
        run: |
          @'
          from auto_cleanup import group_allowances

          snapshot = {
              "group_keyword_ids": {
                  "g1": [str(i) for i in range(10)],
                  "g2": [str(i) for i in range(5)],
                  "g3": [str(i) for i in range(4)],
              }
          }
          allowance = group_allowances(snapshot)
          assert allowance["g1"] == 5
          assert allowance["g2"] == 1
          assert allowance["g3"] == 0
          print("PRODUCTION GROUP SAFETY TEST OK")
          '@ | python -

      - name: V15 production safety self test
        shell: pwsh
        run: |
          @'
          from auto_cleanup import group_allowances
          from restricted_cleanup import parse_keyword_master_limited_ids

          limited_row = ["1", "g1", "nkw-one", "kw1", "70", "", "", "0", "30", "1", "2026-01-01T00:00:00Z", "", "0"]
          normal_row = ["1", "g1", "nkw-two", "kw2", "70", "", "", "0", "20", "1", "2026-01-01T00:00:00Z", "", "0"]
          report = "\n".join(["\t".join(limited_row), "\t".join(normal_row)]) + "\n"
          assert parse_keyword_master_limited_ids(report) == {"nkw-one"}

          snapshot = {
              "group_keyword_ids": {
                  "g10": [str(i) for i in range(10)],
                  "g5": [str(i) for i in range(5)],
                  "g4": [str(i) for i in range(4)],
              }
          }
          allowance = group_allowances(snapshot)
          assert allowance["g10"] == 5
          assert allowance["g5"] == 1
          assert allowance["g4"] == 0
          print("V15 PRODUCTION SAFETY TEST OK")
          '@ | python -

      - name: V15 master-fallback age gate self test
        shell: pwsh
        run: |
          @'
          from auto_cleanup import build_candidate_pool
          from src.keyword_cleaner.policy_v2 import CleanerPolicy

          policy = CleanerPolicy.load()
          def row(kid, age):
              return {
                  "keyword_id": kid,
                  "keyword": "테스트" + kid,
                  "campaign_id": "c1",
                  "campaign_name": "c",
                  "adgroup_id": "g1",
                  "adgroup_name": "업체",
                  "tier": "GENERAL",
                  "status": "DELETE_PENDING",
                  "exposure_eligible": "True",
                  "age_days": str(age),
              }

          snapshot = {
              "campaigns": {"c1": {"status": "ELIGIBLE", "userLock": False}},
              "adgroups": {"g1": {"status": "ELIGIBLE", "userLock": False, "name": "업체"}},
              "keywords": {
                  "young": {
                      "nccKeywordId": "young", "nccAdgroupId": "g1",
                      "keyword": "테스트young", "status": "ELIGIBLE",
                      "inspectStatus": "APPROVED", "userLock": False,
                  },
                  "old": {
                      "nccKeywordId": "old", "nccAdgroupId": "g1",
                      "keyword": "테스트old", "status": "ELIGIBLE",
                      "inspectStatus": "APPROVED", "userLock": False,
                  },
              },
              "group_keyword_ids": {"g1": ["young", "old", "s1", "s2", "s3", "s4"]},
              "total_keywords": 6,
          }
          selected, _ = build_candidate_pool(
              scan_rows=[row("young", 60), row("old", 120)],
              snapshot=snapshot,
              limited_ids=set(),
              policy=policy,
              permanent_keywords=[],
              type_keywords=[],
              reserve_limit=10,
              master_available=False,
          )
          assert [r["keyword_id"] for r in selected] == ["old"]
          print("V15 MASTER FALLBACK AGE GATE TEST OK")
          '@ | python -

      - name: Post-cleanup dashboard refresh self test
        shell: pwsh
        run: |
          @'
          import tempfile
          from pathlib import Path
          import auto_cleanup

          with tempfile.TemporaryDirectory() as temp:
              old_backup = auto_cleanup.BACKUP_DIR
              auto_cleanup.BACKUP_DIR = Path(temp)
              try:
                  scan = [
                      {"keyword_id": "k1", "status": "DELETE_PENDING"},
                      {"keyword_id": "k2", "status": "KEEP"},
                      {"keyword_id": "k3", "status": "DELETE_PENDING"},
                  ]
                  manifest = [
                      {"keyword_id": "k1", "verify_result": "ABSENT_OK"},
                      {"keyword_id": "k3", "verify_result": "STILL_PRESENT"},
                  ]
                  path = auto_cleanup.write_post_cleanup_scan(
                      scan_rows=scan,
                      manifest_rows=manifest,
                      stamp="selftest",
                      expected_total=2,
                  )
                  assert path is not None and path.exists()
                  rows = auto_cleanup.read_csv(path)
                  assert [r["keyword_id"] for r in rows] == ["k2", "k3"]
              finally:
                  auto_cleanup.BACKUP_DIR = old_backup
          print("POST-CLEANUP DASHBOARD REFRESH TEST OK")
          '@ | python -

      - name: Pre-delete archive journal self test
        shell: pwsh
        run: |
          @'
          import sqlite3
          import tempfile
          from pathlib import Path
          from src.keyword_cleaner.lifecycle_store import LifecycleStore

          with tempfile.TemporaryDirectory() as temp:
              db = Path(temp) / "journal.sqlite3"
              store = LifecycleStore(db)
              archive_id = store.prepare_keyword_archive(
                  identity_key="c|g|keyword",
                  keyword_id="k1",
                  campaign_id="c",
                  adgroup_id="g",
                  keyword="테스트키워드",
                  tier="GENERAL",
                  delete_reason="SELF_TEST",
                  payload={"keyword_before_delete": {"keyword": "테스트키워드"}},
              )
              row = store.conn.execute(
                  "SELECT delete_status, payload_json FROM keyword_archive WHERE archive_id = ?",
                  (archive_id,),
              ).fetchone()
              assert row["delete_status"] == "PREPARED"
              assert "테스트키워드" in row["payload_json"]
              store.mark_archive_delete_requested(archive_id)
              store.mark_archive_delete_api_ok(archive_id)
              store.mark_archive_verified(archive_id, gone=True)
              row = store.conn.execute(
                  "SELECT delete_status, verified_at FROM keyword_archive WHERE archive_id = ?",
                  (archive_id,),
              ).fetchone()
              assert row["delete_status"] == "DELETED_VERIFIED"
              assert row["verified_at"]
              store.close()
          print("PRE-DELETE ARCHIVE JOURNAL TEST OK")
          '@ | python -

      - name: Build portable app
        shell: pwsh
        run: |
          pyinstaller --noconfirm DAYLAWKeywordCleaner.spec

      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $root = "dist/DAYLAW Keyword Cleaner"
          $exe = "$root/DAYLAW Keyword Cleaner.exe"
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $exe --stdio-self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          @"
          NAVER_API_KEY=dummy_access_license
          NAVER_SECRET_KEY=dummy_secret
          NAVER_CUSTOMER_ID=123456
          "@ | Set-Content -Path "$root/.env" -Encoding utf8

          & $exe --env-self-test
          $envExit = $LASTEXITCODE
          Remove-Item "$root/.env" -Force
          if ($envExit -ne 0) { exit $envExit }

      - name: Add editable config, writable folders, and env template
        shell: pwsh
        run: |
          $root = "dist/DAYLAW Keyword Cleaner"
          New-Item -ItemType Directory -Force -Path "$root/config" | Out-Null
          Copy-Item "config/*" "$root/config/" -Recurse -Force
          New-Item -ItemType Directory -Force -Path "$root/data/backups" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/data/stats" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/data/state" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/data/delete_audit" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/logs" | Out-Null
          if (Test-Path ".env.example") { Copy-Item ".env.example" "$root/.env.example" -Force }
          Compress-Archive -Path "$root/*" -DestinationPath "DAYLAW-Keyword-Cleaner-Windows.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: DAYLAW-Keyword-Cleaner-Windows
          path: DAYLAW-Keyword-Cleaner-Windows.zip
          if-no-files-found: error
