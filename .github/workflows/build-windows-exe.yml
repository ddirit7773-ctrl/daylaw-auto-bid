name: Build Windows Desktop App

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Compile check
        shell: pwsh
        run: |
          python -m py_compile daylaw_app.py desktop_app.py desktop_app_v2.py desktop_app_v3.py desktop_app_v4.py desktop_app_v5.py desktop_app_v6.py restore_deleted_keyword.py query_account_stats.py execute_v2_delete.py run_v2_scan.py src/keyword_cleaner/naver_api.py src/keyword_cleaner/stats_v2.py src/keyword_cleaner/policy_v2.py

      - name: Safe-fast policy self test
        shell: pwsh
        run: |
          @'
          from src.keyword_cleaner.policy_v2 import ActivitySnapshot, CleanerPolicy, classify_snapshot

          policy = CleanerPolicy.load()
          common = dict(
              adgroup_name="테스트업체",
              keyword="테스트업체일반키워드",
              policy=policy,
          )

          # Recent impressions already force WATCH. The longer click lookup may
          # be skipped and must never make the keyword deletable.
          active = ActivitySnapshot(
              age_days=max(policy.general_inactivity_days, policy.general_protection_days) + 10,
              inactivity_impressions=3,
              inactivity_clicks=0,
              click_window_clicks=None,
              exposure_eligible=True,
              stats_complete=True,
          )
          assert classify_snapshot(snapshot=active, **common).status == "WATCH"

          # A silent keyword without the longer click-protection result must
          # stay DATA_INSUFFICIENT, never DELETE_PENDING.
          missing_long_window = ActivitySnapshot(
              age_days=max(policy.general_inactivity_days, policy.general_protection_days) + 10,
              inactivity_impressions=0,
              inactivity_clicks=0,
              click_window_clicks=None,
              exposure_eligible=True,
              stats_complete=False,
          )
          assert classify_snapshot(snapshot=missing_long_window, **common).status == "DATA_INSUFFICIENT"

          # Only fully verified silence may reach DELETE_PENDING.
          fully_silent = ActivitySnapshot(
              age_days=max(policy.general_inactivity_days, policy.general_protection_days) + 10,
              inactivity_impressions=0,
              inactivity_clicks=0,
              click_window_clicks=0,
              exposure_eligible=True,
              stats_complete=True,
          )
          assert classify_snapshot(snapshot=fully_silent, **common).status == "DELETE_PENDING"
          print("SAFE FAST POLICY TEST OK")
          '@ | python -

      - name: Build portable app
        shell: pwsh
        run: |
          pyinstaller --noconfirm DAYLAWKeywordCleaner.spec

      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $root = "dist/DAYLAW Keyword Cleaner"
          $exe = "$root/DAYLAW Keyword Cleaner.exe"
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $exe --stdio-self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          @"
          NAVER_API_KEY=dummy_access_license
          NAVER_SECRET_KEY=dummy_secret
          NAVER_CUSTOMER_ID=123456
          "@ | Set-Content -Path "$root/.env" -Encoding utf8

          & $exe --env-self-test
          $envExit = $LASTEXITCODE
          Remove-Item "$root/.env" -Force
          if ($envExit -ne 0) { exit $envExit }

      - name: Add editable config, writable folders, and env template
        shell: pwsh
        run: |
          $root = "dist/DAYLAW Keyword Cleaner"
          New-Item -ItemType Directory -Force -Path "$root/config" | Out-Null
          Copy-Item "config/*" "$root/config/" -Recurse -Force
          New-Item -ItemType Directory -Force -Path "$root/data/backups" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/data/stats" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/data/state" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/logs" | Out-Null
          if (Test-Path ".env.example") { Copy-Item ".env.example" "$root/.env.example" -Force }
          Compress-Archive -Path "$root/*" -DestinationPath "DAYLAW-Keyword-Cleaner-Windows.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: DAYLAW-Keyword-Cleaner-Windows
          path: DAYLAW-Keyword-Cleaner-Windows.zip
          if-no-files-found: error
